name: lint

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: rust fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Kora configs match the two-id rollout
        run: node scripts/kora-config-lint.cjs

      - name: Deploy commands in the docs deploy a built artifact
        run: node scripts/deploy-docs-lint.cjs

      - name: SDK release decisions (version order, dist-tags)
        run: node --test scripts/sdk-release.test.mjs

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Allow-list explained:
      # - op_ref / needless_borrow / manual_range_contains / too_many_arguments:
      #   stylistic lints that fire in audited code shared byte-identically with
      #   program-v2. Touching them changes audited bytes and triggers an
      #   unnecessary delta audit on cosmetic refactors.
      # - unused_mut: same — appears in a test closure in state/action.rs.
      # When the audit baseline rolls over, revisit and tighten this list.
      - name: cargo clippy (devnet features)
        run: |
          cargo clippy --features devnet --all-targets -- \
            -D warnings \
            -A clippy::op_ref \
            -A clippy::needless_borrow \
            -A clippy::manual_range_contains \
            -A clippy::too_many_arguments \
            -A unused_mut

      - name: cargo test (program lib)
        run: cargo test --features devnet -p lazorkit-program --lib

  # The litesvm integration suite under program/tests/ has never run in CI:
  # the `rust` job above uses `--lib`, which skips every integration target, and
  # nothing built the SBF artifact those tests load. Clippy's `--all-targets`
  # compiles them, so they were type-checked but never executed — which is how a
  # red test (secp256r1_tests::test_add_multiple_secp256r1_authorities) sat on
  # develop unnoticed. This job actually runs them.
  program-integration:
    name: program litesvm integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      # The release toolchain (scripts/sbf-toolchain.sh), not the stable
      # installer, so the suite tests the bytes that ship: the stable
      # installer's cargo-build-sbf 4.4.0 builds this crate without LTO.
      - name: Read the toolchain pin
        run: |
          . scripts/sbf-toolchain.sh
          echo "SBF_AGAVE_RELEASE=$SBF_AGAVE_RELEASE" >> "$GITHUB_ENV"
          echo "SBF_PLATFORM_TOOLS_VERSION=$SBF_PLATFORM_TOOLS_VERSION" >> "$GITHUB_ENV"

      - name: Install Solana toolchain (pinned)
        run: |
          sh -c "$(curl -sSfL "https://release.anza.xyz/$SBF_AGAVE_RELEASE/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Check cargo-build-sbf is the pinned version
        run: |
          cargo-build-sbf --version
          . scripts/sbf-toolchain.sh
          sbf_toolchain_check strict

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            test-fixtures/malicious-cpi/target
          key: sbf-tests-${{ runner.os }}-${{ env.SBF_AGAVE_RELEASE }}-${{ env.SBF_PLATFORM_TOOLS_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      # Builds both the program and the malicious-cpi wrapper that
      # repro_h1_cpi_bypass loads as a second .so, both as SBPF v0 with the
      # pinned platform-tools (the script passes --tools-version and
      # --arch v0; see its header).
      - name: Build SBF artifacts
        run: ./scripts/build-repro-fixtures.sh

      - name: cargo test (integration)
        run: cargo test --features devnet -p lazorkit-program --tests

      # The sunset binary is a different build — the program id is compiled in
      # and it refuses all but three instructions — so its suite needs its own
      # artifact. Built last: nothing after this step reads the devnet one.
      # `--arch v0` as in build-repro-fixtures.sh: cargo-build-sbf 4.4.0 makes
      # v3 the default, which litesvm 0.6 cannot load.
      - name: Build sunset artifact (rehearsal-v1)
        working-directory: program
        run: cargo build-sbf --features rehearsal-v1 --tools-version "$SBF_PLATFORM_TOOLS_VERSION" --arch v0

      - name: cargo test (sunset binary)
        run: cargo test --features rehearsal-v1 -p lazorkit-program --test sunset_tests

  sdk:
    name: sdk build/test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sdk-kit
            dir: sdk/sdk-kit
            test: true
          - name: sdk-legacy
            dir: sdk/sdk-legacy
            test: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: install
        working-directory: ${{ matrix.dir }}
        run: npm ci || npm install

      - name: build
        working-directory: ${{ matrix.dir }}
        run: npm run build

      - name: test
        if: ${{ matrix.test == true }}
        working-directory: ${{ matrix.dir }}
        run: npm test

  sdk-integration-types:
    name: sdk integration typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/sdk-kit/package-lock.json
            sdk/sdk-legacy/package-lock.json
            tests-sdk-kit/package-lock.json
            tests-sdk/package-lock.json

      - name: install sdk-kit
        working-directory: sdk/sdk-kit
        run: npm ci || npm install

      - name: build sdk-kit
        working-directory: sdk/sdk-kit
        run: npm run build

      - name: install sdk-legacy
        working-directory: sdk/sdk-legacy
        run: npm ci || npm install

      - name: build sdk-legacy
        working-directory: sdk/sdk-legacy
        run: npm run build

      - name: install tests-sdk-kit
        working-directory: tests-sdk-kit
        run: npm ci || npm install

      - name: typecheck tests-sdk-kit
        working-directory: tests-sdk-kit
        run: npx tsc -p tsconfig.json --noEmit

      - name: install tests-sdk
        working-directory: tests-sdk
        run: npm ci || npm install

      - name: typecheck tests-sdk
        working-directory: tests-sdk
        run: npx tsc -p tsconfig.json --noEmit

      # Typed approval requests, off chain: the challenge against the SDK, a
      # reference written from the program, and the vectors that
      # program/tests/typed_approval_vectors_tests.rs (the litesvm job) signs
      # with and lands; the codec, the decoder, transaction sizes, and the
      # bundle of @lazorkit/sdk-legacy/approval. Needs no validator.
      # 21-approval-e2e needs a validator and runs with tests-sdk locally.
      - name: approval unit tests
        working-directory: tests-sdk
        run: npx vitest run tests/20-approval-unit.test.ts
