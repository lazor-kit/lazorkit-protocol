# Kora paymaster — devnet.
#
# Written against kora v2.2.0-beta.8. Do not apply it to an older build: beta.7
# parses `--api-key` and ignores it, races past usage limits under concurrency,
# and leaks the RPC URL's query string in client-facing errors. Check what is
# running with `getVersion`, or `scripts/kora-check.cjs <url> --cluster devnet
# --allow-open` (the devnet relayer runs without an API key; see [kora.auth]).
#
# Same shape as kora.mainnet.toml, which carries the reasoning; this file only
# notes where devnet deliberately differs. Keep the two in step — a devnet that
# is looser in ways nobody wrote down stops being a rehearsal for mainnet.
#
# No secret belongs in this file. The API key, HMAC secret, reCAPTCHA secret
# and signer key all come from the environment:
#   KORA_API_KEY  KORA_HMAC_SECRET  KORA_RECAPTCHA_SECRET  KORA_PRIVATE_KEY
# KORA_REDIS_URL is needed only once usage limits are back on (they are off —
# see [kora.usage_limit]). With them and [kora.cache] both off, nothing reads it.

[kora]
# Requests per second, but per connection, not server-wide. beta.8 mounts it as
# tower's RateLimitLayer in the HTTP middleware, which the server builds afresh
# for each connection, so each connection has its own budget; a request over it
# is delayed, not refused. It smooths load. It is not a cap on the server's
# total rate, and not a bound on how fast the sponsor can be spent.
rate_limit = 100

[kora.auth]
# Where devnet deliberately differs (decided 2026-10-06): the devnet relayer
# runs with NO KORA_API_KEY. With no key configured anywhere the auth layer is
# not mounted, so every method answers a caller without `x-api-key` —
# `getConfig` and the signing methods included. Two reasons:
#   - Both SDKs (@lazorkit/wallet, @lazorkit/wallet-mobile-adapter) default to
#     https://kora.devnet.lazorkit.com and send no `x-api-key`; a key here
#     would refuse every integrator who uses the defaults.
#   - A key that ships in a public browser or app bundle is not a secret.
#     Everyone who reads the bundle has it, so it can cut off a client but
#     bounds nobody.
#
# What bounds the sponsor here instead:
#   - `require_one_of_programs`: only transactions that touch LazorKit v2
#     (devnet) are sponsored at all;
#   - `max_allowed_lamports`: 0.05 SOL per transaction;
#   - `[validation.fee_payer_policy]`: everything shut except System transfer
#     and create-account, which the protocol's own CPIs need;
#   - the fee payer's own balance: devnet SOL, but kept to a working float and
#     topped up as it is spent, because with no key it bounds the total.
# `rate_limit` is not one of them — it is per connection, see [kora].
#
# Mainnet is not changed by this: kora.mainnet.toml expects KORA_API_KEY.
#
# The day an SDK release ships a devnet key or a reCAPTCHA token, this changes.
# A key: set KORA_API_KEY on the service, redeploy, and run
# scripts/kora-check.cjs without --allow-open — `authentication` should then
# PASS. A reCAPTCHA token: set KORA_RECAPTCHA_SECRET; it gates only the methods
# below, so `getConfig` still answers anonymously and the check keeps
# --allow-open. Either way, older SDK releases send neither and are refused from
# that moment. Until then KORA_RECAPTCHA_SECRET stays unset: Kora refuses a
# protected method that arrives without an `x-recaptcha-token` header, and
# neither SDK sends one yet, so setting it refuses every SDK transaction.
# recaptcha_score_threshold = 0.5
protected_methods = ["signTransaction", "signAndSendTransaction"]

[kora.lighthouse]
# Lighthouse appends balance assertions that abort a transaction if the fee
# payer loses more than expected — the direct answer to fee-payer drains.
#
# It is off because it cannot work with the flow the clients use today: adding
# an instruction invalidates signatures already collected, so it only applies to
# `signTransaction` → client re-signs → client sends. `packages/react` and
# `packages/react-native` both call `signAndSendTransaction` on the main path.
# Turning this on is worth doing, but it is a client change first.
enabled = false
fail_if_transaction_size_overflow = true

[kora.cache]
# Account/price caching is an optimisation. Turn it on once Redis is attached
# and you have watched a deploy come up with it. It reads KORA_REDIS_URL ahead
# of `url`, as the usage limits below do for their store — and each only when
# it is enabled, so with both off no Redis is needed.
enabled = false
# url = "redis://..."
default_ttl = 300
account_ttl = 60
price_ttl = 0

[kora.enabled_methods]
liveness = true
get_version = true
get_blockhash = true
get_config = true
get_payer_signer = true
estimate_transaction_fee = true
sign_transaction = true
sign_and_send_transaction = true
# Off: nothing in LazorKit calls them, and each is a way to ask the payer for
# something. `transfer_transaction` in particular builds a transfer funded by
# the fee payer.
transfer_transaction = false
get_supported_tokens = false

[validation]
# What one sponsored transaction may cost the fee payer, in lamports.
#
# Measured on mainnet (getMinimumBalanceForRentExemption):
#   Wallet, 8 bytes                 0.00069088 SOL
#   Authority, 145 bytes (passkey)  0.00138684 SOL
#   FeeRecord, 32 bytes (once/payer) 0.0008128 SOL
#   token account, 165 bytes        0.00148844 SOL
# so CreateWallet costs the payer ~0.0029 SOL and a migration lands around 0.01.
# Devnet is deliberately looser than mainnet's 0.015, so that rehearsals and
# integrator testing with odd shapes are not refused at the relayer. That slack
# is not free: with no authentication here (see [kora.auth]) this is what any
# one sponsored transaction may cost the payer, and the payer's balance is what
# bounds the total — so the balance is kept to a working float, not a reserve
# (deploy/kora/README.md, "Still open"). Faucet airdrops are rate-limited, so a
# top-up is a deliberate transfer, not a free refill. The old devnet relayer
# allowed 0.1.
max_allowed_lamports = 50000000

# Payer, plus an Ed25519 owner where one signs. Passkey flows add no signature:
# the precompile verifies, it does not sign.
max_signatures = 4

# No outbound price oracle on devnet; nothing reads it while price.type = free.
price_source = "Mock"
allow_durable_transactions = false
cross_cluster_check = false

# Every instruction's program id must appear here — precompiles included, with
# no exemption, and instructions that only appear in simulation are checked too.
# A missing entry is a refusal at the relayer, before anything reaches the chain.
allowed_programs = [
    "57bTNWqtYTJbWuLWASKo6GqUTAK6oFDUR5c6hEc6V8nv",   # LazorKit v2 (devnet)
    # The v1 program (4h3XoNRe…) — uncomment ONLY after it runs the sunset
    # binary. Until then it is full v1, whose Execute forwards every outer signer
    # into its CPIs (H-3): sponsoring it from this relayer would let any v1 wallet
    # conscript this fee payer. v1 traffic before the sunset belongs on its own
    # relayer with its own thin-funded signer.
    # "4h3XoNReAgEcHVxcZ8sw2aufi9MTr7BbvYYjzjWDyDxS",
    "Secp256r1SigVerify1111111111111111111111111",   # passkey precompile — every v2 user action carries one
    "11111111111111111111111111111111",              # System
    "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA",   # SPL Token
    "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb",   # Token-2022 — a wallet holding one cannot migrate without it
    "ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL",  # Associated Token Account
    "ComputeBudget111111111111111111111111111111",   # the compute-limit instruction the SDK prepends
    # "L2TExMFKdjpN9kozasaurPirfHy9P8sbXoAN1qA3S95", # Lighthouse — uncomment with [kora.lighthouse].enabled
]

# The line that turns a general-purpose relayer into this protocol's relayer: a
# transaction that never touches LazorKit is refused outright, whatever else it
# asks for. Without it, `allowed_programs` alone still sponsors a bare System
# transfer.
require_one_of_programs = [
    "57bTNWqtYTJbWuLWASKo6GqUTAK6oFDUR5c6hEc6V8nv",
    # "4h3XoNReAgEcHVxcZ8sw2aufi9MTr7BbvYYjzjWDyDxS",  # the v1 program — with the sunset binary only, see above
]

# Only meaningful for token-denominated payment, which this deployment does not
# use. Kept to USDC rather than opened.
allowed_tokens = [
    "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",
]
allowed_spl_paid_tokens = []
disallowed_accounts = []

# The sponsor pays; that is the product. What bounds it is
# `require_one_of_programs` and the lamport cap above, the fee-payer policy
# below and the fee payer's own balance (no authentication on devnet, see
# [kora.auth]) — not the price policy, and not `rate_limit`, which is per
# connection (see [kora]). The usage limits are off; [kora.usage_limit] below
# says why.
[validation.price]
type = "free"

# What the FEE PAYER may be used for. Two flags have to stay open because the
# protocol itself needs them: the program funds its PDAs and pays the protocol
# fee through System CPIs with the payer as source. Everything else is shut.
#
# If a legitimate flow starts being refused, the relayer's error names the
# instruction — open that one flag, rather than reverting this block.
[validation.fee_payer_policy.system]
allow_transfer = true        # the protocol fee CPI, payer -> treasury shard
allow_create_account = true  # rent for Wallet, Authority, FeeRecord, ATAs
allow_assign = false
allow_allocate = false

[validation.fee_payer_policy.system.nonce]
allow_initialize = false
allow_advance = false
allow_authorize = false
allow_withdraw = false

[validation.fee_payer_policy.spl_token]
# The payer is never the source of a token movement in any LazorKit flow — the
# vault is. Nothing here needs to be true.
allow_transfer = false
allow_burn = false
allow_close_account = false
allow_approve = false
allow_revoke = false
allow_set_authority = false
allow_mint_to = false
allow_initialize_mint = false
allow_initialize_account = false
allow_initialize_multisig = false
allow_freeze_account = false
allow_thaw_account = false
allow_withdraw_excess_lamports = false
allow_unwrap_lamports = false

[validation.fee_payer_policy.token_2022]
allow_transfer = false
allow_burn = false
allow_close_account = false
allow_approve = false
allow_revoke = false
allow_set_authority = false
allow_mint_to = false
allow_initialize_mint = false
allow_initialize_account = false
allow_initialize_multisig = false
allow_freeze_account = false
allow_thaw_account = false
allow_withdraw_excess_lamports = false
allow_unwrap_lamports = false

[validation.fee_payer_policy.alt]
allow_create = false
allow_extend = false
allow_freeze = false
allow_deactivate = false
allow_close = false

[validation.token_2022]
# deny_all, not the laxer default. Under
# `deny_mutable_for_delayed_signing` a mint whose transfer-hook authority is
# still mutable is accepted on `signAndSendTransaction` — which is the flow both
# clients use — and that authority can swap the hook program between the moment
# we sign and the moment it executes. The cost of denying: a user holding a
# transfer-hook token cannot move it through the sponsor. That is the right way
# round.
transfer_hook_policy = "deny_all"

# PermanentDelegate is deliberately NOT blocked, against the validator's advice.
# Its warning is about payment tokens — a delegate seizing what it was paid —
# and this relayer takes no token payment at all (price.type = "free"). Blocking
# it here would only refuse to sponsor a user moving their own token out of a v1
# vault. Revisit if fees are ever charged in tokens.
blocked_mint_extensions = []
blocked_account_extensions = []

# Usage limits are OFF, deliberately (decided 2026-10-06), in step with
# kora.mainnet.toml, which has the full reasoning. In short: on beta.8, usage
# limits with `price.type = "free"` refuse any signing request that carries no
# `user_id` param, and neither @lazorkit/wallet nor
# @lazorkit/wallet-mobile-adapter sends one — so with this on, the relayer
# refuses every SDK transaction. A local beta.8 running this file
# refused a wallet creation exactly this way on 2026-10-05. And the `user_id`
# it would key on is a string the caller chooses: it bounds integrators who
# send a stable id, not a caller who varies it.
#
# Meanwhile a stranger is bounded by `require_one_of_programs`,
# `max_allowed_lamports`, the fee-payer policy and the fee payer's balance —
# not by authentication, which devnet runs without (see [kora.auth]), and not by
# `rate_limit`, which is per connection. On devnet that balance is devnet SOL;
# keep it to a working float anyway and alert on it, because this is the
# rehearsal. While RPC_URL is the public endpoint, alert on `getBalance` through
# a provider rather than on [metrics.fee_payer_balance]: that metric comes from
# Kora's own poll through RPC_URL, which intermittently reads the payer as not
# found (README, "Still open").
#
# Turning it back on is the same here as on mainnet: SDK sends a `user_id`,
# KORA_REDIS_URL set, `fallback_if_unavailable` stays false, flip `enabled`.
# The rules stay below so that is one line; while off, Kora parses them but
# neither builds nor applies them.
[kora.usage_limit]
enabled = false
# Required whenever this table is present. When on: cache down = refuse, not
# sponsor blindly.
fallback_if_unavailable = false

[[kora.usage_limit.rules]]
# Higher than mainnet: a test script legitimately loops.
type = "transaction"
max = 300
window_seconds = 3600

# An instruction rule can only name an instruction Kora's own parser
# recognises: System `createaccount` / `createaccountwithseed`, ATA `create` /
# `createidempotent`, and the loaders. `InstructionIdentifier::identify` returns
# None for any other program, so a rule naming a LazorKit instruction would
# silently never match — bound the rent instead, which is what a caller actually
# spends of ours.
[[kora.usage_limit.rules]]
type = "instruction"
program = "11111111111111111111111111111111"
instruction = "createaccount"
max = 60
window_seconds = 3600

[[kora.usage_limit.rules]]
# Destination token accounts during a migration. Counted only where the fee
# payer is the one funding them.
type = "instruction"
program = "ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL"
instruction = "createidempotent"
max = 60
window_seconds = 3600

# Its own port. On the RPC port the metrics handler is mounted before the auth
# layer, so anyone who can reach the relayer can read them.
[metrics]
enabled = true
endpoint = "/metrics"
port = 9090
scrape_interval = 60

[metrics.fee_payer_balance]
enabled = true
expiry_seconds = 30

[kora.plugins]
enabled = []

[kora.bundle]
enabled = false
